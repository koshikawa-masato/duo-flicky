name: DuoFlicky
options:
  deploymentTarget:
    iOS: "27.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8JN36X5T3B
    CODE_SIGN_STYLE: Automatic
packages:
  AzooKeyKanaKanjiConverter:
    url: https://github.com/azooKey/AzooKeyKanaKanjiConverter
    exactVersion: 0.11.2
targets:
  DuoFlicky:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: DuoFlickyKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.duoflicky.app
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(DUO_FLICKY_PROFILE)
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "8"
        MARKETING_VERSION: "0.1.0"
        INFOPLIST_KEY_CFBundleDisplayName: Duo Flicky
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  DuoFlickyKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    dependencies:
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.duoflicky.app.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(DUO_FLICKY_PROFILE)
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Duo Flicky
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: false
            PrefersRightToLeft: false
            RequestsOpenAccess: false
schemes:
  DuoFlicky:
    build:
      targets:
        DuoFlicky: all
    run:
      config: Debug
